<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lezzet Mührü 1932 - Yönetici Girişi</title>
  <link rel="icon" type="image/png" href="../../public/images/favicon-round.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Admin Login Specific Premium Glassmorphic Styles */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      background-color: #0b0f13;
    }

    /* Bottom fade-to-black gradient mask to hide grill grate in video background */
    body::after {
      content: '' !important;
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 45vh !important;
      background: linear-gradient(0deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.95) 50%, rgba(0, 0, 0, 0) 100%) !important;
      z-index: -1 !important;
      pointer-events: none !important;
      display: block !important;
    }

    .login-container {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: 20px;
      z-index: 10;
    }

    .login-card {
      background: rgba(15, 22, 28, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px 30px 35px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: cardFadeIn 0.8s ease-out;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 2px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    }

    .login-card h2 {
      font-family: 'Playfair Display', serif;
      color: #f39c12;
      font-size: 1.8rem;
      margin-bottom: 2px;
      font-weight: 700;
    }

    .login-card p {
      color: #95a5a6;
      font-size: 0.9rem;
      margin-bottom: 35px;
    }

    .form-group {
      position: relative;
      margin-bottom: 24px;
      text-align: left;
    }

    .form-group label {
      display: block;
      color: #f39c12;
      font-size: 0.95rem;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-align: left;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #7f8c8d;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #f39c12;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.25);
    }

    .input-wrapper input:focus + i {
      color: #f39c12;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f39c12, #d35400);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(243, 156, 18, 0.45);
      background: linear-gradient(135deg, #f1c40f, #e67e22);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .btn-login:disabled {
      background: #7f8c8d;
      box-shadow: none;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
      animation: alertFadeIn 0.3s ease;
    }

    @keyframes alertFadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-danger {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid rgba(231, 76, 60, 0.3);
      color: #e74c3c;
    }

    .alert-success {
      background: rgba(46, 204, 113, 0.15);
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71;
    }

    .spinner {
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .back-home {
      display: inline-block;
      margin-top: 25px;
      color: #f39c12;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .back-home:hover {
      color: #e67e22;
    }

    .form-actions-wrapper, .alert-wrapper {
      margin-left: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- Global background video element to match premium aesthetic -->
  <video id="globalBgVideo" autoplay loop muted playsinline class="global-bg-video" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; width: auto; height: auto; z-index: -100; object-fit: cover; opacity: 0.4;">
    <source src="../../public/images/video.mp4" type="video/mp4">
  </video>

  <div class="login-container">
    <div class="login-card">
      <img src="../../public/images/favicon-round.png" alt="Lezzet Mührü Logo" class="login-logo">
      <h2>Yönetici Paneli</h2>
      <p>Devam etmek için yetkili kimlik bilgilerinizi giriniz.</p>

      <div class="alert-wrapper">
        <div id="loginAlert" class="alert alert-danger"></div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Kullanıcı Adı:</label>
          <div class="input-wrapper">
            <input type="text" id="username" autocomplete="username" placeholder="Kullanıcı adınızı girin" required>
            <i class="fa-solid fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Şifre:</label>
          <div class="input-wrapper">
            <input type="password" id="password" autocomplete="current-password" placeholder="Şifrenizi girin" required>
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>

        <div class="form-actions-wrapper">
          <button type="submit" id="submitBtn" class="btn-login">
            <i class="fa-solid fa-circle-notch spinner" id="btnSpinner"></i>
            <span id="btnText">Giriş Yap</span>
          </button>
        </div>
      </form>

      <a href="../index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Web Sitesine Dön</a>
    </div>
  </div>

  <script>
    // Giriş Kontrolü
    document.addEventListener('DOMContentLoaded', async () => {
      const alertBox = document.getElementById('loginAlert');
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      // Tarayıcıdan yerel dosya olarak açma uyarısı (file:// veya farklı port kontrolü)
      if (window.location.protocol === 'file:') {
        showAlert('⚠️ <strong>Sunucu Bağlantısı Yok:</strong> Sayfayı yerel dosya olarak açtınız. Yönetim panelinin çalışması için lütfen tarayıcınızdan <a href="http://localhost:3000/admin/login.html" style="color: #f39c12; text-decoration: underline; font-weight: 600;">http://localhost:3000/admin/login.html</a> adresine gidiniz.', 'danger');
        return;
      }

      // Zaten giriş yapılmış mı kontrol et
      try {
        const response = await fetch('/api/admin/check-auth');
        const data = await response.json();
        if (data.authenticated) {
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        console.error('Yetki kontrolü yapılamadı:', err);
      }

      // Form Gönderimi
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showAlert('Kullanıcı adı ve şifre gereklidir.', 'danger');
          return;
        }

        // Loading state
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Giriş Yapılıyor...';
        alertBox.style.display = 'none';

        try {
          const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const result = await response.json();

          if (response.ok && result.success) {
            showAlert('Giriş başarılı! Yönlendiriliyorsunuz...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          } else {
            showAlert(result.message || 'Kullanıcı adı veya şifre hatalı.', 'danger');
            submitBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnText.textContent = 'Giriş Yap';
          }
        } catch (err) {
          console.error('Giriş hatası:', err);
          showAlert('Sunucu ile bağlantı kurulamadı. Lütfen daha sonra tekrar deneyiniz.', 'danger');
          submitBtn.disabled = false;
          btnSpinner.style.display = 'none';
          btnText.textContent = 'Giriş Yap';
        }
      });

      function showAlert(message, type) {
        alertBox.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> <span>${message}</span>`;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
